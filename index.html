<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Has sido invitado</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Georgia, serif;

    background: #ead5d9;

    color: #604b50;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 25px;
}

.card {
    width: 100%;
    max-width: 430px;

    background: #f7eeee;

    border-radius: 28px;

    padding: 32px 22px;

    text-align: center;

    border: 1px solid #d9bfc4;

    box-shadow:
        0 12px 35px rgba(91, 60, 68, 0.16);
}

.roses {
    font-size: 43px;

    margin-bottom: 12px;
}

.small {
    letter-spacing: 3px;

    font-size: 11px;

    text-transform: uppercase;

    color: #92757c;
}

h1 {
    font-size: 35px;

    margin: 14px 0 10px;

    color: #7d5d65;
}

.subtitle {
    font-size: 17px;

    line-height: 1.6;

    color: #6b555b;
}

.scratch-container {
    position: relative;

    width: 100%;

    height: 190px;

    margin: 25px auto;

    border-radius: 22px;

    overflow: hidden;

    background: #c6a1a9;

    touch-action: none;

    box-shadow:
        inset 0 0 0 1px #b89199;
}

.secret {
    position: absolute;

    inset: 0;

    background: #f0dfe2;

    display: flex;

    justify-content: center;

    align-items: center;

    flex-direction: column;

    padding: 20px;
}

.secret-title {
    font-size: 25px;

    font-weight: bold;

    color: #7d5862;

    margin-bottom: 8px;
}

.secret-text {
    font-size: 17px;

    line-height: 1.4;

    color: #654e54;
}

.heart {
    font-size: 28px;

    margin: 10px;

    color: #a57b84;
}

#scratchCanvas {
    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;
}

.instruction {
    font-size: 14px;

    color: #876b72;

    margin-top: -12px;
}

.confirm-section {
    margin-top: 27px;

    padding-top: 22px;

    border-top:
        1px solid #d9bfc4;
}

.confirm-section p {
    color: #6b555b;

    font-size: 16px;
}

.confirm-button {
    display: inline-block;

    background: #9b777f;

    color: white;

    padding: 15px 30px;

    border-radius: 30px;

    font-size: 16px;

    text-decoration: none;

    box-shadow:
        0 5px 15px rgba(95, 67, 75, 0.20);

    transition: transform .2s;
}

.confirm-button:active {
    transform: scale(.95);
}

</style>
</head>

<body>

<div class="card">

    <div class="roses">
        🌸
    </div>

    <div class="small">
        Una invitación especial
    </div>

    <h1>
        Has sido invitado
    </h1>

    <p class="subtitle">
        Pero antes de descubrirlo...
        hay una pequeña sorpresa para ti.
    </p>

    <div class="scratch-container">

        <div class="secret">

            <div class="secret-title">
                ✨ ¡Sorpresa! ✨
            </div>

            <div class="secret-text">
                Tu sitio está reservado.<br>
                Ahora solo falta una cosa...
            </div>

            <div class="heart">
                ♥
            </div>

        </div>

        <canvas id="scratchCanvas"></canvas>

    </div>

    <p class="instruction">
        ☝️ Rasca con el dedo para descubrir la sorpresa
    </p>

    <div class="confirm-section">

        <p>
            ¿Vas a venir?
        </p>

        <a
            class="confirm-button"
            href="https://docs.google.com/forms/d/e/1FAIpQLSeCIwTVLLmEXsi31U8dWNEg9ObIDLVrr-SPmxxfvCVBac0UDg/viewform?usp=publish-editor"
            target="_blank">

            Confirmar asistencia

        </a>

    </div>

</div>

<script>

const canvas =
    document.getElementById("scratchCanvas");

const ctx =
    canvas.getContext("2d");


function ajustarCanvas() {

    const rect =
        canvas.getBoundingClientRect();

    canvas.width =
        rect.width;

    canvas.height =
        rect.height;


    ctx.fillStyle =
        "#b9959d";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle =
        "#f4e6e8";

    ctx.font =
        "bold 22px Georgia";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    ctx.fillText(
        "RASCA AQUÍ ✨",
        canvas.width / 2,
        canvas.height / 2
    );
}


ajustarCanvas();


window.addEventListener(
    "resize",
    ajustarCanvas
);


let dibujando = false;


function rascar(e) {

    if (!dibujando)
        return;


    const rect =
        canvas.getBoundingClientRect();


    let x;
    let y;


    if (e.touches) {

        x =
            e.touches[0].clientX
            - rect.left;

        y =
            e.touches[0].clientY
            - rect.top;

    } else {

        x =
            e.clientX
            - rect.left;

        y =
            e.clientY
            - rect.top;
    }


    ctx.globalCompositeOperation =
        "destination-out";


    ctx.beginPath();


    ctx.arc(
        x,
        y,
        22,
        0,
        Math.PI * 2
    );


    ctx.fill();
}


canvas.addEventListener(
    "mousedown",
    () => {

        dibujando = true;

    }
);


canvas.addEventListener(
    "mouseup",
    () => {

        dibujando = false;

    }
);


canvas.addEventListener(
    "mousemove",
    rascar
);


canvas.addEventListener(
    "touchstart",
    (e) => {

        dibujando = true;

        rascar(e);

    },
    { passive: false }
);


canvas.addEventListener(
    "touchmove",
    (e) => {

        e.preventDefault();

        rascar(e);

    },
    { passive: false }
);


canvas.addEventListener(
    "touchend",
    () => {

        dibujando = false;

    }
);

</script>

</body>
</html>
