<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Has sido invitado</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Georgia, "Times New Roman", serif;

    background: #e8d2d6;

    color: #5d484e;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 25px;

    overflow-x: hidden;
}


/* PÉTALOS */

.petal {
    position: fixed;

    top: -40px;

    font-size: 20px;

    opacity: 0.65;

    pointer-events: none;

    z-index: 0;

    animation: caer linear infinite;
}

.petal:nth-child(1) {
    left: 8%;
    animation-duration: 8s;
    animation-delay: 0s;
}

.petal:nth-child(2) {
    left: 25%;
    animation-duration: 11s;
    animation-delay: 3s;
}

.petal:nth-child(3) {
    left: 47%;
    animation-duration: 9s;
    animation-delay: 1s;
}

.petal:nth-child(4) {
    left: 68%;
    animation-duration: 12s;
    animation-delay: 4s;
}

.petal:nth-child(5) {
    left: 88%;
    animation-duration: 10s;
    animation-delay: 2s;
}

@keyframes caer {

    0% {
        transform:
            translateY(-50px)
            rotate(0deg);
    }

    50% {
        transform:
            translateY(50vh)
            translateX(35px)
            rotate(180deg);
    }

    100% {
        transform:
            translateY(110vh)
            translateX(-25px)
            rotate(360deg);
    }
}


/* TARJETA */

.card {

    position: relative;

    z-index: 2;

    width: 100%;

    max-width: 440px;

    background: #f7eeee;

    border-radius: 30px;

    padding: 38px 24px;

    text-align: center;

    border: 1px solid #d5b9bf;

    box-shadow:
        0 15px 45px
        rgba(88, 61, 68, 0.18);

    overflow: hidden;
}


/* DECORACIÓN SAKURA */

.branch {

    position: absolute;

    font-size: 55px;

    opacity: 0.55;

    pointer-events: none;
}

.branch.top-left {

    top: 8px;

    left: 8px;

    transform: rotate(-25deg);
}

.branch.top-right {

    top: 8px;

    right: 8px;

    transform: rotate(25deg);
}

.branch.bottom-left {

    bottom: 5px;

    left: 5px;

    transform: rotate(25deg);
}

.branch.bottom-right {

    bottom: 5px;

    right: 5px;

    transform: rotate(-25deg);
}


/* CABECERA */

.sakura {

    font-size: 48px;

    margin-bottom: 10px;

    filter:
        drop-shadow(
            0 2px 2px
            rgba(90,50,60,.12)
        );
}

.small {

    letter-spacing: 4px;

    font-size: 10px;

    text-transform: uppercase;

    color: #92737a;
}

h1 {

    font-size: 36px;

    font-weight: normal;

    margin: 14px 0 12px;

    color: #795861;

    letter-spacing: 0.5px;
}

.subtitle {

    font-size: 17px;

    line-height: 1.65;

    color: #6b545a;

    margin-bottom: 22px;
}


/* RASCA */

.scratch-container {

    position: relative;

    width: 100%;

    height: 190px;

    margin: 25px auto;

    border-radius: 23px;

    overflow: hidden;

    background: #c6a0a9;

    touch-action: none;

    box-shadow:
        inset
        0 0 0 1px
        #b58c96;
}

.secret {

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            135deg,
            #f2e1e4,
            #ead0d5
        );

    display: flex;

    justify-content: center;

    align-items: center;

    flex-direction: column;

    padding: 20px;
}

.secret-title {

    font-size: 25px;

    font-weight: bold;

    color: #7c5660;

    margin-bottom: 8px;
}

.secret-text {

    font-size: 17px;

    line-height: 1.5;

    color: #654d54;
}

.heart {

    font-size: 26px;

    margin-top: 10px;

    color: #a47a83;
}

#scratchCanvas {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;
}

.instruction {

    font-size: 14px;

    color: #896b73;

    margin-top: -12px;
}


/* CONFIRMACIÓN */

.confirm-section {

    margin-top: 28px;

    padding-top: 23px;

    border-top:
        1px solid #d8bec3;
}

.confirm-section p {

    font-size: 16px;

    color: #695159;

    margin-bottom: 18px;
}

.confirm-button {

    display: inline-block;

    background: #9a747d;

    color: white;

    padding: 15px 30px;

    border-radius: 30px;

    font-size: 16px;

    text-decoration: none;

    box-shadow:
        0 6px 16px
        rgba(90,65,72,.20);

    transition:
        transform .2s,
        background .2s;
}

.confirm-button:active {

    transform: scale(.95);

}


/* PIE */

.footer {

    margin-top: 25px;

    font-size: 12px;

    letter-spacing: 1px;

    color: #a07e85;
}

</style>
</head>


<body>


<!-- PÉTALOS -->

<div class="petal">🌸</div>
<div class="petal">🌸</div>
<div class="petal">🌸</div>
<div class="petal">🌸</div>
<div class="petal">🌸</div>


<div class="card">


    <!-- RAMAS DECORATIVAS -->

    <div class="branch top-left">
        🌸
    </div>

    <div class="branch top-right">
        🌸
    </div>

    <div class="branch bottom-left">
        🌸
    </div>

    <div class="branch bottom-right">
        🌸
    </div>


    <!-- CABECERA -->

    <div class="sakura">
        🌸
    </div>

    <div class="small">
        Una invitación especial
    </div>

    <h1>
        Has sido invitado
    </h1>

    <p class="subtitle">

        Pero antes de descubrirlo...
        hay una pequeña sorpresa para ti.

    </p>


    <!-- RASCA -->

    <div class="scratch-container">


        <div class="secret">

            <div class="secret-title">
                ✨ ¡Sorpresa! ✨
            </div>

            <div class="secret-text">

                Tu sitio está reservado.<br>

                Ahora solo falta una cosa...

            </div>

            <div class="heart">
                ♥
            </div>

        </div>


        <canvas id="scratchCanvas"></canvas>


    </div>


    <p class="instruction">

        ☝️ Rasca con el dedo para descubrir la sorpresa

    </p>


    <!-- CONFIRMACIÓN -->

    <div class="confirm-section">

        <p>
            ¿Vas a venir?
        </p>


        <a
            class="confirm-button"

            href="https://docs.google.com/forms/d/e/1FAIpQLSeCIwTVLLmEXsi31U8dWNEg9ObIDLVrr-SPmxxfvCVBac0UDg/viewform?usp=publish-editor"

            target="_blank">

            Confirmar asistencia

        </a>

    </div>


    <div class="footer">

        Con cariño 🌸

    </div>


</div>


<script>


/* RASCA INTERACTIVO */


const canvas =
    document.getElementById(
        "scratchCanvas"
    );

const ctx =
    canvas.getContext("2d");


function ajustarCanvas() {


    const rect =
        canvas.getBoundingClientRect();


    canvas.width =
        rect.width;

    canvas.height =
        rect.height;


    ctx.globalCompositeOperation =
        "source-over";


    ctx.fillStyle =
        "#b9939c";


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle =
        "#f4e6e8";


    ctx.font =
        "bold 22px Georgia";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillText(

        "RASCA AQUÍ ✨",

        canvas.width / 2,

        canvas.height / 2

    );

}


ajustarCanvas();


window.addEventListener(
    "resize",
    ajustarCanvas
);


let dibujando = false;


function rascar(e) {


    if (!dibujando)
        return;


    const rect =
        canvas.getBoundingClientRect();


    let x;

    let y;


    if (e.touches) {


        x =
            e.touches[0].clientX
            - rect.left;


        y =
            e.touches[0].clientY
            - rect.top;


    } else {


        x =
            e.clientX
            - rect.left;


        y =
            e.clientY
            - rect.top;

    }


    ctx.globalCompositeOperation =
        "destination-out";


    ctx.beginPath();


    ctx.arc(

        x,

        y,

        22,

        0,

        Math.PI * 2

    );


    ctx.fill();

}


/* RATÓN */

canvas.addEventListener(

    "mousedown",

    () => {

        dibujando = true;

    }

);


canvas.addEventListener(

    "mouseup",

    () => {

        dibujando = false;

    }

);


canvas.addEventListener(

    "mousemove",

    rascar

);


/* IPAD / MÓVIL */

canvas.addEventListener(

    "touchstart",

    (e) => {

        dibujando = true;

        rascar(e);

    },

    {
        passive: false
    }

);


canvas.addEventListener(

    "touchmove",

    (e) => {

        e.preventDefault();

        rascar(e);

    },

    {
        passive: false
    }

);


canvas.addEventListener(

    "touchend",

    () => {

        dibujando = false;

    }

);

</script>


</body>
</html>
